<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忍店機車行 - 客戶資料登錄</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Microsoft JhengHei', sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #d32f2f; color: white; padding: 20px 16px; text-align: center; }
  .header h1 { font-size: 20px; margin-bottom: 4px; }
  .header p  { font-size: 13px; opacity: .85; }
  .form-body { max-width: 600px; margin: 0 auto; padding: 16px; }
  .section { background: white; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .section-title { font-size: 14px; font-weight: bold; color: #d32f2f; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
  label span.req { color: #d32f2f; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 15px; color: #333;
    background: #fafafa; transition: border .2s;
  }
  input:focus, select:focus { outline: none; border-color: #d32f2f; background: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .submit-btn {
    width: 100%; padding: 16px; background: #d32f2f; color: white;
    border: none; border-radius: 10px; font-size: 17px; font-weight: bold;
    cursor: pointer; margin-top: 8px; transition: background .2s;
  }
  .submit-btn:hover { background: #b71c1c; }
  .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
  #msg { text-align: center; padding: 20px; border-radius: 10px; margin-top: 12px; font-size: 15px; display: none; }
  #msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  #msg.error   { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  #bindBox { display: none; margin-top: 12px; padding: 16px; border-radius: 10px; font-size: 15px; line-height: 1.6; }
  #bindBox.note    { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; text-align: center; }
  #bindBox.confirm { background: #fff8e1; color: #5d4037; border: 1px solid #ffe082; }
  #bindBox .bind-title { font-weight: bold; margin-bottom: 10px; }
  #bindBox button {
    display: block; width: 100%; padding: 13px; margin-top: 8px; border-radius: 8px;
    font-size: 15px; font-weight: bold; cursor: pointer; border: 1px solid #d32f2f;
    background: #d32f2f; color: #fff;
  }
  #bindBox button.secondary { background: #fff; color: #d32f2f; }
  #bindBox button.ghost { background: #fff; color: #777; border-color: #ccc; font-weight: normal; }
  #bindBox button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <h1>🏍 忍店機車行</h1>
  <p>請填寫您的機車資料，方便我們提供更好的服務</p>
</div>

<div class="form-body">
  <form id="regForm">

    <div class="section">
      <div class="section-title">🛵 車輛基本資料</div>
      <div class="field">
        <label>車牌號碼 <span class="req">*</span></label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="text" id="car_no_a" placeholder="ABC" maxlength="3"
            style="text-transform:uppercase;text-align:center;flex:1"
            oninput="this.value=this.value.toUpperCase()">
          <span style="font-size:22px;font-weight:bold;color:#555">－</span>
          <input type="text" id="car_no_b" placeholder="1234" maxlength="4"
            style="text-transform:uppercase;text-align:center;flex:1"
            oninput="this.value=this.value.toUpperCase()">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>廠牌</label>
          <select id="brand">
            <option value="0" data-name="">請選擇</option>
            <option value="2" data-name="山葉">山葉 YAMAHA</option>
            <option value="3" data-name="光陽">光陽 KYMCO</option>
            <option value="1" data-name="三陽">三陽 SYM</option>
            <option value="6" data-name="台鈴">台鈴 SUZUKI</option>
            <option value="11" data-name="HONDA">本田 HONDA</option>
            <option value="8" data-name="AEON">AEON</option>
            <option value="12" data-name="GOGORO">GOGORO</option>
            <option value="4" data-name="偉士牌">偉士牌</option>
            <option value="5" data-name="比雅久">比雅久</option>
            <option value="7" data-name="哈特佛">哈特佛</option>
            <option value="0" data-name="其它">其他</option>
          </select>
        </div>
        <div class="field">
          <label>機型／車款 <span style="color:#999;font-size:12px">如不了解可諮詢技師</span></label>
          <input type="text" id="class" placeholder="例：勁戰六代">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>排氣量（CC）</label>
          <input type="number" id="cc" value="125" min="50" max="1500">
        </div>
        <div class="field">
          <label>行程數</label>
          <select id="cycle">
            <option value="4">四行程</option>
            <option value="2">二行程</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>顏色</label>
        <input type="text" id="color_name" placeholder="例：消光黑">
      </div>
    </div>

    <div class="section">
      <div class="section-title">👤 車主資料</div>
      <div class="field">
        <label>車主姓名 <span class="req">*</span>（填姓氏即可）</label>
        <input type="text" id="name" placeholder="例：陳" required>
      </div>
      <div class="field">
        <label>性別</label>
        <select id="sex">
          <option value="1">男</option>
          <option value="2">女</option>
        </select>
      </div>
      <div class="field">
        <label>手機號碼 <span class="req">*</span></label>
        <input type="tel" id="mobile_phone" placeholder="0912345678" required>
      </div>
      <div class="field">
        <label>市話</label>
        <input type="tel" id="tel" placeholder="含區號，例：04-12345678">
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">確認送出</button>
    <div id="msg"></div>
    <div id="bindBox"></div>

  </form>
</div>

<script>
const SUPABASE_URL = 'https://hxzdmosganinyhtrswlj.supabase.co'
const SUPABASE_KEY = 'sb_publishable_AYWfHD9vBAVk4Fv1tcuEVw_RTPM71RQ'
const LIFF_ID     = '2009551033-SAcB0ZjL'

let lineUserId      = ''
let lineDisplayName = ''

// LIFF 初始化：在 LINE 環境中取得 userId
async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID })
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile()
      lineUserId      = profile.userId
      lineDisplayName = profile.displayName
    } else if (!liff.isInClient()) {
      // 外部瀏覽器尚未登入 → 導向 LINE 登入
      liff.login({ redirectUri: location.href })
    }
  } catch(e) {
    // 不在 LINE 環境也可正常填表，不影響送出
    console.log('LIFF init:', e.message)
  }
}

const liffReadyPromise = initLiff()

// ---- LINE 車牌綁定（送出建檔資料「之後」才執行；失敗不影響建檔） ----
function bindRpc(carNo, action, oldCar) {
    const body = { p_car_no: carNo, p_line_user_id: lineUserId, p_line_display_name: lineDisplayName }
    if (action) body.p_confirm_action = action
    if (oldCar) body.p_old_car_no = oldCar
    return fetch(SUPABASE_URL + '/rest/v1/rpc/bind_line_user', {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    }).then(function(r) { return r.json() })
}

function closeLater(ms) {
    if (typeof liff !== 'undefined' && liff.isInClient()) {
        setTimeout(function() { liff.closeWindow() }, ms)
    }
}

function showBindNote(text) {
    const box = document.getElementById('bindBox')
    box.className = 'note'
    box.textContent = text
    box.style.display = 'block'
}

function bindResultText(r, carNo) {
    if (r && r.success) return '✅ 已把 ' + carNo + ' 綁定到您的 LINE，之後維修進度會通知您。'
    if (r && r.error === 'conflict_bound_to_other') return '⚠️ 您的資料已送出，但這台車已有其他 LINE 帳號綁定，請告知店員協助處理。'
    return '⚠️ 您的資料已送出，但 LINE 綁定未完成，請告知店員協助處理。'
}

function showBindConfirm(carNo, existingCars) {
    const box = document.getElementById('bindBox')
    box.className = 'confirm'
    box.innerHTML = ''
    const title = document.createElement('div')
    title.className = 'bind-title'
    title.textContent = '您的 LINE 目前已綁定：' + existingCars.join('、')
    box.appendChild(title)
    const ask = document.createElement('div')
    ask.textContent = '這台 ' + carNo + ' 要怎麼處理？'
    box.appendChild(ask)

    function addBtn(label, cls, handler) {
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = label
        if (cls) b.className = cls
        b.addEventListener('click', function() {
            box.querySelectorAll('button').forEach(function(x) { x.disabled = true })
            handler(b)
        })
        box.appendChild(b)
    }
    function finish(r) {
        showBindNote(bindResultText(r, carNo))
        closeLater(3000)
    }
    function fail() {
        box.querySelectorAll('button').forEach(function(x) { x.disabled = false })
        const err = document.createElement('div')
        err.style.cssText = 'color:#c62828;margin-top:8px'
        err.textContent = '網路錯誤，請再按一次。'
        box.appendChild(err)
    }

    addBtn('➕ 新增這台車（原本的車也保留）', '', function() {
        bindRpc(carNo, 'add').then(finish).catch(fail)
    })
    existingCars.forEach(function(old) {
        addBtn('🔄 換成這台新車（解除 ' + old + '）', 'secondary', function() {
            bindRpc(carNo, 'replace', old).then(finish).catch(fail)
        })
    })
    addBtn('先不綁定', 'ghost', function() {
        showBindNote('好的，您的資料已送出。如需綁定 LINE 通知，請告知店員。')
        closeLater(3000)
    })
    box.style.display = 'block'
    box.scrollIntoView({ behavior: 'smooth', block: 'center' })
}

async function handleBind(carNo) {
    try {
        const r = await bindRpc(carNo)
        if (r && r.need_confirm) {
            showBindConfirm(carNo, r.existing_cars || [])
            return
        }
        showBindNote(bindResultText(r, carNo))
    } catch(e) {
        console.log('bind_line_user failed:', e.message)
    }
    closeLater(3000)
}

document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault()
    const btn = document.getElementById('submitBtn')
    const msg = document.getElementById('msg')
    btn.disabled = true
    btn.textContent = '確認身份中...'
    msg.style.display = 'none'

    // 確保 LIFF 身份確認流程（含加好友）已經跑完，最多等 5 秒，避免卡死
    await Promise.race([
        liffReadyPromise,
        new Promise(resolve => setTimeout(resolve, 5000))
    ])

    btn.textContent = '送出中...'

    const carA = document.getElementById('car_no_a').value.trim().toUpperCase()
    const carB = document.getElementById('car_no_b').value.trim().toUpperCase()
    if (!carA || !carB) {
        msg.className = 'error'
        msg.textContent = '❌ 請填寫完整車牌號碼'
        msg.style.display = 'block'
        btn.disabled = false
        btn.textContent = '確認送出'
        return
    }
    const carNo = carA + '-' + carB
    const brandSel = document.getElementById('brand')
    const brandVenNo = parseInt(brandSel.value) || 0
    const brandName = brandSel.options[brandSel.selectedIndex].getAttribute('data-name') || ''
    const payload = {
        car_no:            carNo,
        name:              document.getElementById('name').value.trim(),
        mobile_phone:      document.getElementById('mobile_phone').value.trim(),
        tel:               document.getElementById('tel').value.trim(),
        brand:             brandName,
        ven_no:            brandVenNo,
        cc:                parseInt(document.getElementById('cc').value) || 125,
        cycle:             parseInt(document.getElementById('cycle').value) || 4,
        color_name:        document.getElementById('color_name').value.trim(),
        class:             document.getElementById('class').value.trim(),
        sex:               parseInt(document.getElementById('sex').value),
        line_user_id:      lineUserId,
        line_display_name: lineDisplayName
    }

    try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/customer_form_submissions', {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify(payload)
        })
        if (res.ok) {
            msg.className = 'success'
            msg.innerHTML = '✅ 資料已成功送出！<br>感謝您填寫，我們將盡快確認。'
            document.getElementById('regForm').reset()

            // 同步把 LINE 身份綁定進 customers 表（供完修通知等功能查詢使用）
            // 已有其他車的客人會跳出「新增 / 換成新車」確認；確認前不關閉視窗
            if (lineUserId) {
                handleBind(carNo)
            } else {
                closeLater(2000)
            }
        } else {
            const err = await res.text()
            msg.className = 'error'
            msg.textContent = '❌ 送出失敗，請告知店員。錯誤：' + err
        }
    } catch(e) {
        msg.className = 'error'
        msg.textContent = '❌ 網路錯誤，請確認網路連線後重試。'
    }

    msg.style.display = 'block'
    btn.disabled = false
    btn.textContent = '確認送出'
    msg.scrollIntoView({ behavior: 'smooth' })
})
</script>
</body>
</html>
